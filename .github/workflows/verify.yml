name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"   # daily upstream-spec drift check

jobs:
  verify-public-surface:
    name: Verify public surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run public-surface verifier
        run: python scripts/verify_public_surface.py

  detector-tests:
    name: Detector rules (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install --upgrade pip && python -m pip install pytest
      - name: Run pytest
        run: python -m pytest tests/ -q

  doctor-smoke:
    name: Doctor scans fixtures + examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bad fixtures must FAIL (exit 1)
        run: |
          set +e
          python scripts/kalshi_doctor.py tests/fixtures/bad
          code=$?
          if [ "$code" -ne 1 ]; then echo "bad fixtures did not fail (exit $code)"; exit 1; fi
      - name: Good fixtures must PASS (exit 0)
        run: |
          set +e
          python scripts/kalshi_doctor.py tests/fixtures/good
          code=$?
          if [ "$code" -ne 0 ]; then echo "good fixtures wrongly failed (exit $code)"; exit 1; fi

  upstream-drift:
    name: Upstream Kalshi spec drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch specs, hash, open issue on change
        run: python scripts/check_upstream_drift.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  packaging-checks:
    name: Skill packaging discovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Skill discovery (npx skills add . --list)
        run: npx --yes skills@latest add . --list
      - name: Claude plugin manifest validation
        run: |
          npm install -g @anthropic-ai/claude-code || true
          if command -v claude >/dev/null 2>&1; then
            claude plugin validate . --strict
          else
            echo "claude CLI not available in this runner image; skipping plugin validate"
          fi
