name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-public-surface:
    name: Verify public surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run public-surface verifier
        run: python scripts/verify_public_surface.py
